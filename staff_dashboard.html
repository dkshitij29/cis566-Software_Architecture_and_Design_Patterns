<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Dashboard</title>
    <link rel="stylesheet" href="styles/guest_dashboard.css">
    <link rel="stylesheet" href="styles/guest_dashboard_sidebar.css">
    <link href='https://cdn.boxicons.com/3.0.4/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <link href='https://cdn.boxicons.com/3.0.4/fonts/brands/boxicons-brands.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="config.js"></script>
</head>
<body>
    <div class="grid-container">

        <div class = "sidebar-wrapper" style = "background-color: #372f22;">
            <!-- HEADER TOPBAR-->
                <a href="#" class="logo-wrapper">
                    <span class = "logo" style="background-color: #bb7e24;"> HS </span>
                    <h2 class = "hide">HOTEL STAFF</h2>
                </a>

            <!-- HEADER END -->

            <!-- Profile / Avatar -->
                <div class = "sidebar-profile" style="border-top: 1px solid #bb7e24">
                    <div class = "avatar-wrapper">
                        <i class='bx  bx-user-circle' alt="profile"></i> 
                    </div>
                    <div class = "avatar-name">
                        <div class = "user-name">username</div>
                        <div class = "email">user@email.com</div>
                    </div>
                </div> 

                <!-- SIDEBAR LINK -->
                <div class = "sidebar-link" id="sidebar-link-staff-1" style="border-top:  1px solid #bb7e24;">
                    <ul>
                        <li>
                            <a href = "#" class="sidebar-tab" >
                                <i class = "bx bx-calendar-check"></i>
                                <span class = "link">Check-In Desk</span>
                            </a>
                        </li>
                    </ul>
                </div>
                <!-- SIDEBAR LINK END -->

                <!-- SIDEBAR BOTTOM -->
                <div class = "sidebar-bottom">
                    <div class = "sidebar-link" id="sidebar-link-staff-2" style="border-top: 1px solid #bb7e24;">
                        <ul>
                            <li>
                                <a href = "#" class="sidebar-tab">
                                    <i class = "bx bx-cog"></i>
                                    <span class = "link">Settings</span>
                                </a>
                                <a href="#" id="guest-logout-btn"> 
                                    <i class="bx bx-arrow-out-right-circle-half"></i>
                                    <span href="#" class="link" onclick="logoutStaff()">Log Out</a>
                                </a>
                            </li>
                        </ul>
                    </div>

                    <!-- Profile / Avatar End -->
                </div>
                <!-- SIDEBAR BOTTOM END -->
            </div>


        <div class="page active" id= "check-in-page" style="padding: 40px;">
            <div class="card">
                <div class="card-header">
                    <p class="text-primary">GUEST CHECK-IN & PAYMENT</p>
                </div>
                <div class="card-info">
                    <form id="checkin-form">
                        <div class="field-holder">
                            <label>Guest Email</label>
                            <input type="email" id="ci-email" required placeholder="guest@example.com" style="width:100%; padding:10px; margin-bottom:10px;">
                        </div>
                        <div class="field-holder">
                            <label>Room Type Booked</label>
                            <select id="ci-room-type" required style="width:100%; padding:10px; margin-bottom:10px;">
                                <option value="single">Single</option>
                                <option value="double">Double</option>
                                <option value="suite">Suite</option>
                                <option value="deluxe">Deluxe</option>
                                <option value="economy">Economy</option>
                            </select>
                        </div>
                        <div class="field-holder">
                            <label>Payment Method</label>
                            <select id="ci-payment" required style="width:100%; padding:10px; margin-bottom:10px;">
                                <option value="credit_card">Credit Card</option>
                                <option value="cash">Cash</option>
                                <option value="paypal">PayPal</option>
                                <option value="bank_transfer">Bank Transfer</option>
                            </select>
                        </div>
                        <div class="field-holder">
                            <label>Transaction ID (from machine)</label>
                            <input type="text" id="ci-trans-id" required placeholder="TXN-123456" style="width:100%; padding:10px; margin-bottom:10px;">
                        </div>
                        
                        <button type="submit" id="process-checkin-button">
                            PROCESS CHECK-IN
                        </button>
                    </form>
                </div>
            </div>
        </div>


        <div class="page" id="settings">
            <div class="card">
                <div class="card-header">
                    <p class="text-primary">ACCOUNT SETTINGS</p>
                    <button id="delete-account-btn">DELETE ACCOUNT</button>
                </div>
                <div class="card-info">
                    <p><strong>Current Account Information</strong></p>
                    <p>First Name: <span id="current-firstname">John</span></p>
                    <p>Last Name: <span id="current-lastname">Doe</span></p>
                    <p>Email: <span id="current-email">john.doe@example.com</span></p>
                    <p>Phone: <span id="current-phone">123-456-7890</span></p>
                </div>
            </div>
        </div>

    </div>

    <script>
        document.getElementById('checkin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Matches CheckInRequest model in main.py
            const body = {
                email: document.getElementById('ci-email').value,
                room_type: document.getElementById('ci-room-type').value,
                payment_method: document.getElementById('ci-payment').value,
                transaction_id: document.getElementById('ci-trans-id').value
            };

            try {
                const response = await fetch(`${API_BASE_URL}/bookings/check-in`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body)
                });

                const data = await response.json();
                
                if (response.ok) {
                    alert("Success: " + data.message); // Should say "Success" based on logic.py
                } else {
                    alert("Error: " + data.detail);
                }
            } catch (err) {
                console.error(err);
                alert("Connection failed.");
            }
        });
        function logoutStaff() {
            localStorage.clear(); 
            window.location.href = "index.html";
        }

        const sidebarLinks = document.querySelectorAll('.sidebar-tab');
        const pages = document.querySelectorAll('.page');

        function showPage(pageId) {
            pages.forEach(p => p.classList.remove('active'));
            const target = document.getElementById(pageId);
            if (target) target.classList.add('active');
        }

        sidebarLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault(); 
            
                sidebarLinks.forEach(l => l.classList.remove('active'));
                link.classList.add('active');

                const text = link.innerText.trim();
                if (text === "Check-In Desk") {
                    showPage("check-in-page");
                }
                if (text === "Settings") showPage("settings");
            });
        });

        window.addEventListener('DOMContentLoaded', () => {
            const checkInTab = Array.from(sidebarLinks).find(link => link.innerText.trim() === "Check-In Desk");
            if (checkInTab) {
                checkInTab.classList.add('active');
                showPage("check-in-page");
            }
        });
    </script>
</body>
</html>

name: Python Tests

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Removed unstable 3.14 and 3.13 versions.
      matrix:
        python-version: ['3.13','3.12', '3.11', '3.10']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Installs all required packages (FastAPI, pytest, supabase, etc.)
        # FIX: Explicitly reference the requirements file in the backend folder.
        pip install -r backend/requirements.txt
        
    - name: "Run 1: Unit Tests (Fast & Mocked DB)"

      run: |
        cd backend/
        pytest test_logic.py
        

name: Python Tests

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Removed unstable 3.14 and 3.13 versions.
      matrix:
        python-version: ['3.12', '3.11', '3.10', '3.9']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Installs all required packages (FastAPI, pytest, supabase, etc.)
        pip install -r requirements.txt
        
    - name: "Run 1: Unit Tests (Fast & Mocked DB)"
      # This step is fast and runs tests that do NOT need the actual DB.
      # It runs test_logic.py only.
      run: |
        pytest test_logic.py

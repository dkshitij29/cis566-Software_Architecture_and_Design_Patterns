<!DOCTYPE html>
<html lang="en">

<head> <!-- Just describes the metainformation, wont actually contribute to the view of the page -->
    <meta charset="UTF-8"> <!--setting the font--> 
    <meta name="viewport" content="width=device-width, inital-scale=1.0"> <!-- setting the container scaling -->
    <title>Login</title> <!-- Setting the title of the page-->

    <link rel="stylesheet" href="styles/global_login_pages.css">
    <link rel="stylesheet" href="styles/guest_login_page.css">
    <script defer src = "functionality/login_page.js"></script> <!-- javascript file reference -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>
    <main id="main-holder">
        <div id="welcome-holder">
            <h1 id="welcome-header">HOTEL LOGIN</h1> <!-- setting most important header for the page-->
            <h2 id="welcome-msg">WELCOME GUEST</h2> <!-- setting most important header for the page-->
        </div>

        <div id="login-holder">
            <div id="login-error-msg-holder">
                <p id="login-error-msg">Invalid username <span id="error-msg-second-line"> and/or or password</span></p>
            </div>

            <form id="login-form" novalidate> <!-- defines and labels the input element-->
                <div class="field-holder">
                    <input type="email" name="email" id="email-field" class="login-form-field" placeholder=" " required>
                    <label for="email">email</label>
                </div>
                <div class="field-holder">
                    <input type="password" name="password" id="password-field" class="login-form-field" required>
                    <label for="name">password </label>
                </div>
                <input type="submit" value="LOGIN" id="login-form-submit">
            </form>
            <div class="custom-divider"></div>
            <input type="button" value="NEW USER SIGNUP" id="signup-form-submit" data-redirect = "signup_page.html">
        </div>

    </main>
</body>

</html>
